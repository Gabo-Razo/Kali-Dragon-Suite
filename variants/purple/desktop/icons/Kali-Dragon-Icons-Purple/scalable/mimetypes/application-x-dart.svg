<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Solid Dark Charcoal Plate (#16191f) -->
  <path d="M 26,8 L 62,8 L 78,24 L 78,88 Q 78,92 74,92 L 26,92 Q 22,92 22,88 L 22,12 Q 22,8 26,8 Z" fill="#16191f"/>

  <!-- Outer Double Wireframe Outline -->
  <path d="M 26,8 L 62,8 L 78,24 L 78,88 Q 78,92 74,92 L 26,92 Q 22,92 22,88 L 22,12 Q 22,8 26,8 Z" 
        fill="none" stroke="#d500f9" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 27,10 L 61,10 L 76,25 L 76,86 Q 76,90 72,90 L 27,90 Q 24,90 24,87 L 24,13 Q 24,10 27,10 Z" 
        fill="none" stroke="#e040fb" stroke-width="0.7" stroke-linejoin="round" opacity="0.6"/>

  <!-- Spine Left Margin Line (Double Wireframe) -->
  <line x1="26" y1="9" x2="26" y2="91" stroke="#d500f9" stroke-width="1.2"/>
  <line x1="28" y1="11" x2="28" y2="89" stroke="#e040fb" stroke-width="0.7" opacity="0.6"/>

  <!-- Top Right Fold Corner -->
  <path d="M 62,8 L 62,24 L 78,24" fill="#16191f" stroke="#d500f9" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="62" y1="8" x2="78" y2="24" stroke="#e040fb" stroke-width="0.9"/>

  <!-- Rectangular Bottom Label Banner Box -->
  <rect x="26" y="69" width="52" height="19" rx="1" fill="#16191f" stroke="#d500f9" stroke-width="1.4"/>
  <rect x="27.5" y="70.5" width="49" height="16" rx="0.5" fill="none" stroke="#e040fb" stroke-width="0.6" opacity="0.5"/>

  <!-- Clean Glowing Lowercase Text Label -->
  <text x="52" y="83" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" 
        font-size="10" font-weight="bold" fill="#d500f9" text-anchor="middle" letter-spacing="0.5">dart</text>

  <!-- Center 3D Low-Poly Wireframe Emblem -->
  <g transform="translate(52, 42)">
  <polygon points="-14,-14 6,-14 16,-4 6,14 -14,14 -4,0" fill="none" stroke="#d500f9" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="6" y1="-14" x2="-4" y2="0" stroke="#e040fb" stroke-width="1"/>
  <line x1="16" y1="-4" x2="6" y2="14" stroke="#e040fb" stroke-width="1"/>
</g>

</svg>

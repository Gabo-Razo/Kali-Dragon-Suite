<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur1"/>
      <feGaussianBlur stdDeviation="4.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Halo behind document -->
  <path d="M 26,8 L 62,8 L 78,24 L 78,88 Q 78,92 74,92 L 26,92 Q 22,92 22,88 L 22,12 Q 22,8 26,8 Z" 
        fill="none" stroke="#ff4081" stroke-width="5" opacity="0.35" filter="url(#neon-glow)"/>

  <!-- Solid Dark Charcoal Base Plate (#16191f) -->
  <path d="M 26,8 L 62,8 L 78,24 L 78,88 Q 78,92 74,92 L 26,92 Q 22,92 22,88 L 22,12 Q 22,8 26,8 Z" fill="#16191f"/>

  <!-- Outer Double Wireframe Outline with Glow Core -->
  <path d="M 26,8 L 62,8 L 78,24 L 78,88 Q 78,92 74,92 L 26,92 Q 22,92 22,88 L 22,12 Q 22,8 26,8 Z" 
        fill="none" stroke="#ff4081" stroke-width="2.6" opacity="0.4"/>
  <path d="M 26,8 L 62,8 L 78,24 L 78,88 Q 78,92 74,92 L 26,92 Q 22,92 22,88 L 22,12 Q 22,8 26,8 Z" 
        fill="none" stroke="#ff4081" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 27,10 L 61,10 L 76,25 L 76,86 Q 76,90 72,90 L 27,90 Q 24,90 24,87 L 24,13 Q 24,10 27,10 Z" 
        fill="none" stroke="#f50057" stroke-width="0.7" stroke-linejoin="round" opacity="0.7"/>

  <!-- Spine Left Margin Line (Double Wireframe) -->
  <line x1="26" y1="9" x2="26" y2="91" stroke="#ff4081" stroke-width="2.2" opacity="0.4"/>
  <line x1="26" y1="9" x2="26" y2="91" stroke="#ff4081" stroke-width="1.3"/>
  <line x1="28" y1="11" x2="28" y2="89" stroke="#f50057" stroke-width="0.7" opacity="0.6"/>

  <!-- Top Right Fold Corner -->
  <path d="M 62,8 L 62,24 L 78,24" fill="#16191f" stroke="#ff4081" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="62" y1="8" x2="78" y2="24" stroke="#f50057" stroke-width="0.9"/>

  <!-- Rectangular Bottom Label Banner Box with Glow -->
  <rect x="26" y="69" width="52" height="19" rx="1" fill="#16191f" stroke="#ff4081" stroke-width="2.4" opacity="0.35"/>
  <rect x="26" y="69" width="52" height="19" rx="1" fill="#16191f" stroke="#ff4081" stroke-width="1.5"/>
  <rect x="27.5" y="70.5" width="49" height="16" rx="0.5" fill="none" stroke="#f50057" stroke-width="0.6" opacity="0.5"/>

  <!-- Clean Glowing Lowercase Text Label -->
  <text x="52" y="83" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" 
        font-size="10" font-weight="bold" fill="#ff4081" text-anchor="middle" letter-spacing="0.5"
        filter="drop-shadow(0px 0px 2px #ff4081)">svg</text>

  <!-- Center 3D Low-Poly Wireframe Emblem with Glow -->
  <g filter="url(#neon-glow)" opacity="0.45">
    <g transform="translate(52, 42)">
  <path d="M -14,14 L -4,-12 L 14,-14 L 12,4 Z" fill="none" stroke="#ff4081" stroke-width="1.6"/>
  <circle cx="-14" cy="14" r="2" fill="#ff4081"/>
  <circle cx="-4" cy="-12" r="2" fill="#ff4081"/>
  <circle cx="14" cy="-14" r="2" fill="#ff4081"/>
  <circle cx="12" cy="4" r="2" fill="#ff4081"/>
  <line x1="-4" y1="-12" x2="12" y2="4" stroke="#f50057" stroke-width="0.8"/>
</g>

  </g>
  <g>
    <g transform="translate(52, 42)">
  <path d="M -14,14 L -4,-12 L 14,-14 L 12,4 Z" fill="none" stroke="#ff4081" stroke-width="1.6"/>
  <circle cx="-14" cy="14" r="2" fill="#ff4081"/>
  <circle cx="-4" cy="-12" r="2" fill="#ff4081"/>
  <circle cx="14" cy="-14" r="2" fill="#ff4081"/>
  <circle cx="12" cy="4" r="2" fill="#ff4081"/>
  <line x1="-4" y1="-12" x2="12" y2="4" stroke="#f50057" stroke-width="0.8"/>
</g>

  </g>
</svg>
